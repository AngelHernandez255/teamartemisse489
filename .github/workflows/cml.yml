name: Continuous Machine Learning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Set up CML
        uses: iterative/setup-cml@v2
        with:
          vega: false

      - name: Install dependencies
        run: |
          uv venv --python 3.11
          uv pip install -r requirements.txt
          uv pip install -e . --no-deps

      - name: Train and evaluate model
        env:
          WANDB_MODE: offline
        run: |
          source .venv/bin/activate
          python scripts/run_cml_report.py

      - name: Write CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## TeamArtemisSE489 CML report" > report.md
          echo "" >> report.md
          echo "This workflow trains the SVD recommender on a deterministic CI sample dataset and reports the same metrics used by the project training code." >> report.md
          echo "" >> report.md
          echo "### Metrics" >> report.md
          cat reports/cml/metrics.md >> report.md
          echo "" >> report.md
          echo "### Metric plot" >> report.md
          echo "![](./reports/cml/metrics.png)" >> report.md
          cml comment create --publish report.md
